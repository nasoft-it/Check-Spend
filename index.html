<style>
:root{ --radius:18px; }
:root[data-theme="glow"]{ --bg:#141414;--surface:#222222;--surface-2:#2C2C2C;--line:#3A3A3A;--text:#F5F5F5;--text-dim:#9A9A9A;--accent:#FFFFFF;--accent-2:#CFCFCF;--danger:#FF6B6B;--accent-ink:#111111; }
:root,:root[data-theme="midnight"]{ --bg:#0B0E14;--surface:#151A24;--surface-2:#1C2330;--line:#262E3D;--text:#EDEEF2;--text-dim:#8993A6;--accent:#D4A857;--accent-2:#5EC9BA;--danger:#E8776B;--accent-ink:#1A1406; }
:root[data-theme="ivory"]{ --bg:#F4F1EA;--surface:#FFFFFF;--surface-2:#F0EDE4;--line:#E3DFD3;--text:#22201B;--text-dim:#8A8272;--accent:#B8863E;--accent-2:#2C9A8A;--danger:#C6564A;--accent-ink:#FFF8EC; }
:root[data-theme="emerald"]{ --bg:#0A120F;--surface:#10201A;--surface-2:#162B22;--line:#1F3A2E;--text:#E9F3ED;--text-dim:#83A897;--accent:#34D399;--accent-2:#D8B25C;--danger:#E8776B;--accent-ink:#062017; }
:root[data-theme="ocean"]{ --bg:#0A121C;--surface:#101B29;--surface-2:#16263A;--line:#223349;--text:#E8EEF6;--text-dim:#82A0C0;--accent:#4FA8E8;--accent-2:#4FD3C4;--danger:#E8776B;--accent-ink:#061420; }
:root[data-theme="rose"]{ --bg:#FBF3F3;--surface:#FFFFFF;--surface-2:#F7ECEC;--line:#EEDADA;--text:#2B2020;--text-dim:#8F7676;--accent:#C9727D;--accent-2:#8E7BAE;--danger:#B5453F;--accent-ink:#3A141C; }
:root[data-theme="clay"]{ --bg:#FAF3EA;--surface:#FFFFFF;--surface-2:#F3E9DA;--line:#E8D9C3;--text:#2E2013;--text-dim:#93816A;--accent:#C1652E;--accent-2:#4F8F7B;--danger:#B23B2D;--accent-ink:#2E1206; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
h1,h2,h3,.money{font-family:'Fraunces',serif;font-weight:500;}
button,input,select,textarea{font-family:inherit;}
a{color:inherit;}

#app{display:flex;min-height:100vh;}
.sidebar{width:220px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;}
.brand{padding:0 6px 16px;}
.brand img{display:block;width:100%;height:auto;background:#222;border-radius:16px;}
.navitem{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;border:none;background:none;color:var(--text-dim);font-size:14px;font-weight:600;cursor:pointer;text-align:left;width:100%;}
.navitem.active{background:var(--accent);color:var(--accent-ink);}
.navitem svg{flex-shrink:0;}
.sidebar-bottom{margin-top:auto;display:flex;flex-direction:column;gap:8px;}
.addbtn{background:var(--accent);color:var(--accent-ink);border:none;border-radius:12px;padding:12px;font-weight:700;font-size:13.5px;cursor:pointer;}

main{flex:1;min-width:0;padding:28px 40px 100px;max-width:1500px;width:100%;margin:0 auto;}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}
.eyebrow{color:var(--accent);font-weight:700;font-size:12px;letter-spacing:.03em;}
.herototal{font-size:42px;margin:4px 0 0;}
.trendpill{display:inline-flex;gap:6px;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:20px;margin-top:8px;}
.trendpill.up{color:var(--danger);background:color-mix(in srgb,var(--danger) 14%,transparent);}
.trendpill.down{color:var(--accent-2);background:color-mix(in srgb,var(--accent-2) 14%,transparent);}
.themebtn{background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:8px 12px;font-size:12.5px;font-weight:600;cursor:pointer;}

.periodnav{display:flex;gap:14px;align-items:center;margin-top:20px;flex-wrap:wrap;}
.segmented{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:3px;}
.seg-btn{border:none;background:none;color:var(--text-dim);font-weight:600;font-size:13px;padding:8px 16px;border-radius:11px;cursor:pointer;}
.seg-btn.active{background:var(--accent);color:var(--accent-ink);}
.datepick{display:flex;align-items:center;gap:8px;}
.arrow-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;font-size:16px;}
.datepick-label{position:relative;font-weight:600;font-size:14px;padding:6px 10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;}
.datepick-label input{position:absolute;inset:0;opacity:0;cursor:pointer;}

.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:22px;}
.statcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;}
.statcard.warn{border-color:var(--danger);}
.statcard .v{font-size:18px;font-family:'Fraunces',serif;}
.statcard .l{font-size:11.5px;color:var(--text-dim);margin-top:2px;}
.budgetbar-track{height:8px;background:var(--surface-2);border-radius:6px;overflow:hidden;margin-top:14px;}
.budgetbar-fill{height:100%;background:var(--accent-2);}
.budgetbar-fill.warn{background:#E8B84B;}
.budgetbar-fill.over{background:var(--danger);}

.sectionhead{display:flex;justify-content:space-between;align-items:baseline;margin:28px 0 12px;}
.sectionhead h2{font-size:19px;margin:0;}
.sectionsub{font-size:12px;color:var(--text-dim);}

/* card carousel */
.carousel{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 14px;-webkit-overflow-scrolling:touch;cursor:grab;}
.carousel.dragging{cursor:grabbing;scroll-snap-type:none;user-select:none;}
.carousel::-webkit-scrollbar{height:6px;}
.carousel::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
.flipcard{flex:0 0 260px;height:300px;scroll-snap-align:start;perspective:1200px;cursor:pointer;}
.flipcard-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.8,.2,1);}
.flipcard.flipped .flipcard-inner{transform:rotateY(180deg);}
.face{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:20px;border:1px solid var(--line);background:linear-gradient(155deg,var(--surface),var(--surface-2));box-shadow:0 16px 34px rgba(0,0,0,.3);display:flex;flex-direction:column;}
.face-back{transform:rotateY(180deg);}
.face-top{display:flex;justify-content:space-between;align-items:center;}
.cat-icon{font-size:24px;}
.size-chip{font-size:9.5px;font-weight:700;padding:3px 8px;border-radius:20px;text-transform:uppercase;background:var(--surface-2);color:var(--text-dim);}
.face-name{font-size:17px;margin-top:14px;}
.face-amount{font-size:27px;margin-top:4px;}
.face-meta{font-size:12.5px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.face-meta.muted{color:var(--text-dim);margin-top:2px;}
.face-foot{margin-top:auto;font-size:11.5px;color:var(--text-dim);border-top:1px solid var(--line);padding-top:10px;}
.back-title{font-size:16px;}
.back-amount{font-size:22px;margin-top:2px;}
.backgrid{margin-top:10px;font-size:11.5px;display:flex;flex-direction:column;gap:5px;}
.backgrid b{color:var(--text-dim);font-weight:600;margin-right:4px;}
.back-actions{margin-top:auto;display:flex;gap:6px;padding-top:10px;}
.back-actions button{flex:1;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:11.5px;font-weight:600;padding:7px 0;cursor:pointer;}

/* list */
.listrow{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;cursor:pointer;border:1px solid transparent;}
.listrow:hover{background:var(--surface-2);}
.listrow-icon{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.listrow-mid{flex:1;min-width:0;}
.listrow-name{display:block;font-weight:600;font-size:13.5px;}
.listrow-sub{display:block;margin-top:2px;font-size:11.5px;color:var(--text-dim);}
.listrow-amt{font-weight:700;font-size:13.5px;}
.dategrouphead{font-weight:700;font-size:12.5px;color:var(--text-dim);margin:16px 0 6px;}

.searchrow{display:flex;gap:8px;margin-top:18px;}
.search-input{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;color:var(--text);font-size:13.5px;}
.sort-select{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;color:var(--text);font-size:12.5px;}

.chartcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:16px;}
.chartcard h3{font-size:13.5px;margin:0 0 10px;font-family:inherit;font-weight:700;}

.emptystate{text-align:center;padding:50px 10px;border:1px dashed var(--line);border-radius:18px;margin-top:12px;}
.emptystate .mark{font-size:24px;color:var(--accent);}
.emptystate h3{font-size:17px;margin:8px 0 2px;}
.emptystate p{color:var(--text-dim);font-size:13px;margin:0 0 14px;}
.btn-primary{background:var(--accent);color:var(--accent-ink);border:none;border-radius:12px;padding:10px 18px;font-weight:700;font-size:13.5px;cursor:pointer;}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:80;}
@media(min-width:760px){.overlay{align-items:center;}}
.modal{width:100%;max-width:480px;max-height:88vh;overflow-y:auto;background:var(--bg);border:1px solid var(--line);border-radius:22px 22px 0 0;}
@media(min-width:760px){.modal{border-radius:22px;}}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 6px;position:sticky;top:0;background:var(--bg);}
.modal-head h3{margin:0;font-size:17px;}
.modal-close{width:30px;height:30px;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--text);cursor:pointer;}
.modal-body{padding:6px 20px 24px;display:flex;flex-direction:column;gap:12px;}
.field{display:flex;flex-direction:column;gap:5px;}
.field span{font-size:11.5px;color:var(--text-dim);font-weight:600;}
.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:9px 11px;color:var(--text);font-size:13.5px;}
.field-row{display:flex;gap:10px;}
.datewrap{position:relative;display:flex;}

<div id="intro" aria-label="Check Spend intro">
  <canvas id="intro-bg" class="intro-bg" width="9" height="16" aria-hidden="true"></canvas>
  <video id="intro-video" class="intro-video" muted playsinline preload="auto" disablepictureinpicture></video>
</div>
<script>
(function(){
  var intro=document.getElementById("intro");
  if(!intro)return;
  var root=document.documentElement;
  var main=document.getElementById("intro-video");
  var bg=document.getElementById("intro-bg");
  // landscape screen (computer) -> landscape video; portrait screen (phone) -> portrait video
  var wide=window.innerWidth>window.innerHeight;
  bg.width=wide?16:9; bg.height=wide?9:16;
  main.poster=wide?"assets/intro-desktop-poster.jpg":"assets/intro-poster.jpg";
  main.src=wide?"assets/intro-desktop.mp4":"assets/intro.mp4";
  var ctx=bg.getContext("2d");
  var done=false, startTimer, capTimer;
  root.classList.add("intro-lock");

  function finish(holdMs){
    if(done)return; done=true;
    clearTimeout(startTimer); clearTimeout(capTimer);
    setTimeout(function(){
      intro.classList.add("hide");              // fade out into the app
      root.classList.remove("intro-lock");
      setTimeout(function(){
        try{main.pause();}catch(e){}
        if(intro.parentNode)intro.parentNode.removeChild(intro);
      },700);
    },holdMs||0);
  }

  // copy each video frame onto a tiny canvas; CSS blurs/stretches it to fill the screen (always in sync, very cheap)
  function draw(){if(main.readyState>=2){try{ctx.drawImage(main,0,0,bg.width,bg.height);}catch(e){}}}
  (function loop(){
    if(done)return;
    draw();
    requestAnimationFrame(loop);
  })();

  main.addEventListener("ended",function(){draw();finish(250);});   // hold the last frame briefly
  main.addEventListener("error",function(){try{console.warn("[Check Spend] Intro video failed to load:",main.currentSrc||main.src,"(error code "+(main.error?main.error.code:"?")+"). Make sure the assets folder is uploaded next to index.html.");}catch(e){}finish(0);});     // file missing / unsupported: just open the app

  // autoplay blocked (e.g. iOS Low Power Mode)? go straight to the app
  var pm=main.play(); if(pm&&pm.catch)pm.catch(function(){finish(0);});
  startTimer=setTimeout(function(){if(!(main.currentTime>0))finish(0);},5000);   // video never started (slow network)
  capTimer=setTimeout(function(){finish(0);},12000);    // absolute safety cap
})();
</script>

  const m=/^(\d{2})-(\d{2})-(\d{4})$/.exec(String(txt).trim());if(!m)return null;
  const d=+m[1],mo=+m[2],y=+m[3],t=new Date(y,mo-1,d);
  if(t.getFullYear()!==y||t.getMonth()!==mo-1||t.getDate()!==d)return null;

// days in the period that count for "per day" maths: elapsed days if the period contains today, else the whole period
function periodDays(period,ref){
  if(period==="day")return 1;
  const now=new Date();
  if(period==="month"){
    const full=new Date(ref.getFullYear(),ref.getMonth()+1,0).getDate();

  }
  const y=ref.getFullYear(),full=((y%4===0&&y%100!==0)||y%400===0)?366:365;
  return now.getFullYear()===y?Math.round((Date.UTC(y,now.getMonth(),now.getDate())-Date.UTC(y,0,1))/864e5)+1:full;
}

// Days to divide by for "Avg / day": the whole period (1 day, the days in that month, or 365/366 for the year)
function avgDays(period,ref){
  if(period==="day")return 1;

function computeStats(list,prevList,period,budgets){
  const total=list.reduce((s,e)=>s+e.amount,0);
  const prevTotal=prevList.reduce((s,e)=>s+e.amount,0);
  const amounts=list.map(e=>e.amount);
  const highest=amounts.length?Math.max(...amounts):0, lowest=amounts.length?Math.min(...amounts):0;

  const limit=period==="day"?budgets.daily:period==="month"?budgets.monthly:budgets.yearly;
  const pct=limit?Math.min(999,(total/limit)*100):0;
  const trend=prevTotal===0?(total>0?100:0):((total-prevTotal)/prevTotal)*100;
  return{total,count:list.length,highest,lowest,avg,limit,pct,remaining:limit-total,trend};
}

function navBtn(id,icon,label){return`<button class="navitem ${state.tab===id?"active":""}" data-act="tab" data-tab="${id}">${icon} ${label}</button>`;}
function mobBtn(id,icon,label){return`<button class="${state.tab===id?"active":""}" data-act="tab" data-tab="${id}"><span>${icon}</span>${label}</button>`;}

function periodNavHtml(){
  return`<div class="periodnav">
    <div class="segmented">${["day","month","year"].map(p=>`<button class="seg-btn ${state.period===p?"active":""}" data-act="period" data-p="${p}">${p[0].toUpperCase()+p.slice(1)}</button>`).join("")}</div>
    <div class="datepick">
      <button class="arrow-btn" data-act="shift" data-d="-1">‹</button>
      <div class="datepick-label">${periodLabel(state.period,state.refDate)}
        ${state.period==="day"?`<input type="date" value="${iso(state.refDate)}" data-act="jump">`:""}
        ${state.period==="month"?`<input type="month" value="${state.refDate.getFullYear()}-${pad(state.refDate.getMonth()+1)}" data-act="jump">`:""}
        ${state.period==="year"?`<input type="number" value="${state.refDate.getFullYear()}" data-act="jump">`:""}
      </div>
      <button class="arrow-btn" data-act="shift" data-d="1">›</button>
    </div>
  </div>`;
}

function homeView(items,stats){
  return`
  <div class="topbar">
    <div><div class="eyebrow">Your spending</div><h1 class="herototal">${money(stats.total)}</h1>
    <div class="trendpill ${stats.trend>=0?"up":"down"}">${stats.trend>=0?"▲":"▼"} ${Math.abs(stats.trend).toFixed(1)}% vs last ${state.period}</div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="themebtn" data-act="opencalc">🧮 Calculator</button>
      <button class="themebtn" data-act="cycletheme">🎨 ${THEMES.find(t=>t.id===state.theme).label}</button>
    </div>
  </div>
  ${periodNavHtml()}
  <div class="statgrid">
    ${stat("Transactions",stats.count)}${stat("Avg / day",avgMoney(stats.avg))}${stat("Highest",stats.count?money(stats.highest):"—")}${stat("Lowest",stats.count?money(stats.lowest):"—")}
    ${stat("Budget",money(stats.limit))}${stat("Remaining",money(stats.remaining),stats.remaining<0)}
  </div>
  <div class="budgetbar-track"><div class="budgetbar-fill ${stats.pct>=100?"over":stats.pct>=85?"warn":""}" style="width:${Math.min(100,stats.pct)}%"></div></div>
  <div class="sectionhead"><h2>Browse expenses</h2><span class="sectionsub">Click a card to flip it</span></div>
  ${items.length===0?emptyState():`<div class="carousel">${items.map(cardHtml).join("")}</div>`}
  `;
}
function stat(l,v,warn){return`<div class="statcard ${warn?"warn":""}"><div class="v">${v}</div><div class="l">${l}</div></div>`;}
function emptyState(){return`<div class="emptystate"><div class="mark">◇</div><h3>No expenses yet</h3><p>This period is looking clean.</p><button class="btn-primary" data-act="openadd">Add expense</button></div>`;}

function cardHtml(e){
  const c=cat(e.category);const d=dt(e.date,e.time);
  return`<div class="flipcard" data-id="${e.id}" data-act="flip">
    <div class="flipcard-inner">
      <div class="face face-front">
        <div class="face-top"><span class="cat-icon">${c.i}</span><span class="size-chip">${c.l}</span></div>
        <div class="face-name">${e.name}</div>
        <div class="face-amount" style="color:${c.c}">-${money(e.amount,e.currency)}</div>
        <div class="face-meta">${longDate(d)}</div>
        <div class="face-meta muted">${fmtTime(e.time)}</div>
        <div class="face-foot">${c.l} • ${e.paymentMethod}</div>
      </div>
      <div class="face face-back">
        <div class="back-title">${e.name}</div>
        <div class="back-amount" style="color:${c.c}">${money(e.amount,e.currency)}</div>
        <div class="backgrid">
          <div><b>Date</b>${longDate(d)} · ${fmtTime(e.time)}</div>
          <div><b>Category</b>${c.i} ${c.l}</div>
          <div><b>Payment</b>${e.paymentMethod}</div>
          <div><b>Merchant</b>${e.merchant||"—"}</div>
          ${e.notes?`<div><b>Notes</b>${e.notes}</div>`:""}
        </div>
        <div class="back-actions">
          <button data-act="edit" data-id="${e.id}">Edit</button>
          <button data-act="delete" data-id="${e.id}">Delete</button>
        </div>
      </div>
    </div>
  </div>`;
}

function expensesView(){
  let items=state.expenses.filter(e=>inPeriod(e,state.period,state.refDate));
  if(state.search.trim()){const q=state.search.toLowerCase();items=items.filter(e=>e.name.toLowerCase().includes(q)||(e.merchant||"").toLowerCase().includes(q)||cat(e.category).l.toLowerCase().includes(q));}
  items=[...items].sort((a,b)=>{
    if(state.sortBy==="oldest")return dt(a.date,a.time)-dt(b.date,b.time);
    if(state.sortBy==="highest")return b.amount-a.amount;
    if(state.sortBy==="lowest")return a.amount-b.amount;
    return dt(b.date,b.time)-dt(a.date,a.time);
  });
  const groups=new Map();
  items.forEach(e=>{if(!groups.has(e.date))groups.set(e.date,[]);groups.get(e.date).push(e);});
  const sortedGroups=[...groups.entries()].sort((a,b)=>a[0]<b[0]?1:-1);
  return`
  <div class="sectionhead"><h2>Expenses</h2></div>
  ${periodNavHtml()}
  <div class="searchrow">
    <input class="search-input" placeholder="Search name, merchant, category…" value="${state.search}" data-act="search">
    <select class="sort-select" data-act="sort">
      <option value="newest" ${state.sortBy==="newest"?"selected":""}>Newest</option>
      <option value="oldest" ${state.sortBy==="oldest"?"selected":""}>Oldest</option>
      <option value="highest" ${state.sortBy==="highest"?"selected":""}>Highest</option>

function drawCharts(items){
  const catBox=document.getElementById("catChart"),timeBox=document.getElementById("timeChart");
  if(!items.length)return;

  // --- Spending by category (horizontal bars, no library needed) ---
  const byCat={};items.forEach(e=>byCat[e.category]=(byCat[e.category]||0)+e.amount);
  const catEntries=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const maxC=Math.max(...catEntries.map(([,v])=>v))||1;
  if(catBox)catBox.innerHTML=catEntries.map(([id,v])=>{
    const c=cat(id);
    return`<div style="display:flex;align-items:center;gap:10px;margin:9px 0;">
      <span style="width:104px;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${c.i||""} ${c.l}</span>
      <div style="flex:1;background:var(--surface-2);border-radius:6px;height:16px;overflow:hidden;">
        <div style="width:${Math.max(2,v/maxC*100)}%;height:100%;background:${c.c};border-radius:6px;"></div>
      </div>
      <span style="min-width:74px;text-align:right;font-size:12.5px;font-weight:600;">${money(v)}</span>
    </div>`;
  }).join("");

  // --- Spending over time: every day (or month, for a year) is plotted, empty ones at $0 ---
  const ref=state.refDate,now=new Date(),d=[];
  if(state.period==="year"){
    const y=ref.getFullYear();let last=now.getFullYear()===y?now.getMonth():11;
    items.forEach(e=>{const mm=+e.date.slice(5,7)-1;if(mm>last)last=mm;});
    for(let m=0;m<=last;m++){
      const key=y+"-"+pad(m+1);
      d.push([SM[m],items.filter(e=>e.date.startsWith(key)).reduce((t,e)=>t+e.amount,0),SM[m]+" "+y]);
    }
  }else if(state.period==="month"){
    const y=ref.getFullYear(),m=ref.getMonth(),n=monthDays(ref);
    let last=(now.getFullYear()===y&&now.getMonth()===m)?now.getDate():n;
    items.forEach(e=>{const dd=+e.date.slice(8,10);if(dd>last)last=dd;});
    for(let i=1;i<=last;i++){
      const key=y+"-"+pad(m+1)+"-"+pad(i);
      d.push([String(i),items.filter(e=>e.date===key).reduce((t,e)=>t+e.amount,0),i+" "+SM[m]]);
    }
  }else{
    const t=items.reduce((t,e)=>t+e.amount,0);
    d.push([String(ref.getDate()),t,SM[ref.getMonth()]+" "+ref.getDate()]);
  }
  if(!timeBox||!d.length)return;
  const W=640,H=220,L=62,R=14,T=14,B=28;
  const rawMax=Math.max(...d.map(x=>x[1]))||1;
  const pw=Math.pow(10,Math.floor(Math.log10(rawMax/2))),f=(rawMax/2)/pw;
  const stepV=(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*pw,max=stepV*2;
  const x=i=>d.length===1?(L+(W-L-R)/2):L+i*(W-L-R)/(d.length-1);
  const y=v=>T+(H-T-B)*(1-v/max);
  const pts=d.map((r,i)=>[x(i),y(r[1])]);
  const line=pts.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join(" ");
  const area=line+` L${pts[pts.length-1][0].toFixed(1)} ${H-B} L${pts[0][0].toFixed(1)} ${H-B} Z`;
  const FF='font-family="Inter, \'Segoe UI\', Arial, Helvetica, sans-serif"';
  const grid=[0,1,2].map(k=>{const v=stepV*k,gy=y(v);return`<line x1="${L}" x2="${W-R}" y1="${gy}" y2="${gy}" stroke="var(--line)" stroke-width="1"/><text ${FF} x="${L-8}" y="${gy+4}" text-anchor="end" font-size="11" fill="var(--text-dim)">${moneyShort(v)}</text>`;}).join("");
  const showLbl=(r,i)=>state.period==="month"?(+r[0]===1||+r[0]%5===0):true;
  const xl=d.map((r,i)=>showLbl(r,i)?`<text ${FF} x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--text-dim)">${r[0]}</text>`:"").join("");
  const dots=d.map((r,i)=>r[1]>0?`<circle cx="${pts[i][0]}" cy="${pts[i][1]}" r="${d.length<=12?4:3}" fill="var(--accent)"><title>${r[2]}: ${money(r[1])}</title></circle>`:"").join("");
  timeBox.innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;">
    ${grid}
    <path d="${area}" fill="var(--accent)" opacity=".15"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}${xl}</svg>`;
}

function budgetsView(){
  const ref=state.refDate,B=state.budgets;
  const monthItems=state.expenses.filter(e=>inPeriod(e,"month",ref));
  const total=monthItems.reduce((t,e)=>t+e.amount,0);
  const limit=B.monthly||0,n=monthDays(ref);
  const pct=limit>0?Math.min(999,(total/limit)*100):0;
  const elapsed=periodDays("month",ref),isCurrent=new Date().getMonth()===ref.getMonth()&&new Date().getFullYear()===ref.getFullYear();
  const left=isCurrent?n-elapsed:0;
  const projected=isCurrent&&elapsed>0?total/elapsed*n:total;
  const byDay={};monthItems.forEach(e=>byDay[e.date]=(byDay[e.date]||0)+e.amount);
  const overDays=B.daily>0?Object.values(byDay).filter(v=>v>B.daily).length:0;
  const warns=[];
  if(B.daily*n>B.monthly&&B.monthly>0)warns.push(`Daily limit ${money(B.daily)} × ${n} days = ${money(B.daily*n)}, which is more than your monthly limit of ${money(B.monthly)}.`);
  if(B.monthly*12>B.yearly&&B.yearly>0)warns.push(`Monthly limit ${money(B.monthly)} × 12 = ${money(B.monthly*12)}, which is more than your yearly limit of ${money(B.yearly)}.`);
  const inp="width:120px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;color:var(--text);";
  const row=(l,v,extra="")=>`<div style="display:flex;justify-content:space-between;font-size:13px;margin-top:6px;"><span style="color:var(--text-dim);">${l}</span><span style="font-weight:600;${extra}">${v}</span></div>`;
  return`
  <div class="sectionhead"><h2>Budgets</h2></div>
  <div class="chartcard">
    <h3>Overall limits</h3>
    ${["daily","monthly","yearly"].map(k=>`<div class="field-row" style="align-items:center;margin-bottom:8px;"><span style="flex:1;font-size:13px;text-transform:capitalize;">${k}</span><span style="color:var(--text-dim);margin-right:4px;">$</span><input type="number" min="0" step="0.01" style="${inp}" value="${(+B[k]||0).toFixed(2)}" data-act="budget" data-k="${k}"></div>`).join("")}
    ${warns.map(w=>`<p style="font-size:12.5px;color:var(--danger);margin:8px 0 0;">⚠ ${w}</p>`).join("")}
    ${warns.length?`<p style="font-size:11.5px;color:var(--text-dim);margin:6px 0 0;">You can keep these values, but staying under the smaller limit won't keep you under the larger one.</p>`:""}
  </div>
  <div class="chartcard"><h3>${MN[ref.getMonth()]} ${ref.getFullYear()}</h3>
    <p style="font-size:13px;color:var(--text-dim);margin:0;">Spent ${money(total)} of ${money(limit)} monthly budget.</p>
    <div class="budgetbar-track"><div class="budgetbar-fill ${pct>=100?"over":pct>=85?"warn":""}" style="width:${Math.min(100,pct)}%"></div></div>
    ${row("Used",Math.round(pct)+"%")}
    ${row(limit-total>=0?"Remaining":"Over budget by",money(Math.abs(limit-total)),limit-total<0?"color:var(--danger);":"")}
    ${isCurrent?row("Days left",left===0?"Last day of the month":left+(left===1?" day":" days")+" left"):""}
    ${isCurrent?row("Projected month-end",money(projected),limit>0&&projected>limit?"color:var(--danger);":""):""}
    ${B.daily>0?row("Days over daily limit",overDays+(overDays?" (above "+money(B.daily)+")":""),overDays?"color:var(--danger);":""):""}
  </div>
  `;
}

// Date a NEW expense starts with = the day you're looking at, so it lands on the screen you're on:
//  Day view   -> the day shown (e.g. you stepped to 4 Oct -> 04-10-2026)
//  Month/Year -> today if today is inside what's shown, otherwise the first day of the month/year shown
function defaultExpenseDate(){
  const now=new Date(),ref=state.refDate;
  if(state.period==="day")return iso(ref);
  const sameYear=now.getFullYear()===ref.getFullYear();
  if(state.period==="year"){return sameYear?iso(now):iso(new Date(ref.getFullYear(),0,1));}
  return(sameYear&&now.getMonth()===ref.getMonth())?iso(now):iso(new Date(ref.getFullYear(),ref.getMonth(),1));
}

/* mouse drag-to-scroll for carousels */
let dragState={active:false,startX:0,scrollLeft:0,moved:false,el:null};
let suppressNextClick=false;
document.addEventListener("mousemove",e=>{
  if(!dragState.active)return;
  const dx=e.pageX-dragState.startX;
  if(Math.abs(dx)>5)dragState.moved=true;
  dragState.el.scrollLeft=dragState.scrollLeft-dx;
});
document.addEventListener("mouseup",()=>{
  if(!dragState.active)return;
  dragState.active=false;
  if(dragState.el)dragState.el.classList.remove("dragging");
  if(dragState.moved)suppressNextClick=true;
});

app.addEventListener("input",e=>{

  if(t.id==="f-date"){
    const dg=t.value.replace(/\D/g,"").slice(0,8);
    t.value=dg.length>4?dg.slice(0,2)+"-"+dg.slice(2,4)+"-"+dg.slice(4):dg.length>2?dg.slice(0,2)+"-"+dg.slice(2):dg;

function wire(){
  app.querySelectorAll(".carousel").forEach(car=>{
    car.addEventListener("mousedown",e=>{
      dragState={active:true,startX:e.pageX,scrollLeft:car.scrollLeft,moved:false,el:car};
      car.classList.add("dragging");
      e.preventDefault();
    });
    car.addEventListener("wheel",e=>{
      if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){car.scrollLeft+=e.deltaY;e.preventDefault();}
    },{passive:false});
  });
  app.querySelectorAll("[data-act]").forEach(el=>{
    el.addEventListener("click",e=>{
      if(suppressNextClick){suppressNextClick=false;e.preventDefault();e.stopPropagation();return;}
      e.stopPropagation();
      const act=el.dataset.act;
      if(act==="tab"){state.tab=el.dataset.tab;render();}
      else if(act==="period"){state.period=el.dataset.p;render();}
      else if(act==="shift"){const d=new Date(state.refDate);const delta=+el.dataset.d;if(state.period==="day")d.setDate(d.getDate()+delta);else if(state.period==="month")d.setMonth(d.getMonth()+delta);else d.setFullYear(d.getFullYear()+delta);state.refDate=d;render();}
      else if(act==="pickdate"){const n=document.getElementById("f-date-native");if(n){const v=parseDMY(document.getElementById("f-date").value);if(v)n.value=v;try{n.showPicker();}catch(_){n.focus();n.click();}}}
      else if(act==="opencalc"){Calc.open();}
      else if(act==="savenow"){saveNow();render();toast("Saved");}
      else if(act==="toggleautosave"){autosave=!autosave;save("ledger_autosave",autosave);if(autosave&&dirty)saveNow();render();toast(autosave?"Auto-save on":"Auto-save off. Use Save now to keep changes.");}
      else if(act==="cycletheme"){const i=THEMES.findIndex(t=>t.id===state.theme);state.theme=THEMES[(i+1)%THEMES.length].id;persist();render();}
      else if(act==="openadd"){state.editTarget=null;pickedCat=null;state.showModal=true;render();}
      else if(act==="closemodal"){state.showModal=false;render();}
      else if(act==="closedetail"){state.detail=null;render();}
      else if(act==="flip"){el.classList.toggle("flipped");}
      else if(act==="detail"){state.detail=state.expenses.find(x=>x.id===el.dataset.id);render();}
      else if(act==="pickcat"){pickedCat=el.dataset.c;app.querySelectorAll(".catchip").forEach(c=>c.classList.remove("active"));el.classList.add("active");}
      else if(act==="edit"){const target=state.expenses.find(x=>x.id===el.dataset.id);state.editTarget=target;pickedCat=target.category;state.detail=null;state.showModal=true;render();}
      else if(act==="delete"){state.expenses=state.expenses.filter(x=>x.id!==el.dataset.id);state.detail=null;persist();render();toast("Expense deleted");}
      else if(act==="save"){
        const id=el.dataset.id;
        const nameVal=document.getElementById("f-name").value.trim();
        const amtVal=parseFloat(document.getElementById("f-amount").value);
        const dateVal=parseDMY(document.getElementById("f-date").value);
        if(!nameVal){alert("Give the expense a name.");return;}
        if(isNaN(amtVal)||amtVal<=0){alert("Enter an amount greater than 0.");return;}
        if(!dateVal){alert("Enter the date as DD-MM-YYYY, for example 03-10-2026.");return;}
        const data={name:nameVal,amount:amtVal,currency:document.getElementById("f-currency").value,category:pickedCat||(state.editTarget?state.editTarget.category:"food"),date:dateVal,time:document.getElementById("f-time").value,paymentMethod:document.getElementById("f-payment").value,merchant:document.getElementById("f-merchant").value,notes:document.getElementById("f-notes").value};
        if(id){state.expenses=state.expenses.map(x=>x.id===id?{...x,...data}:x);}
        else{state.expenses.push({...data,tags:[],id:uid()});}
        state.showModal=false;persist();render();toast(id?"Expense updated":"Expense added");
      }
      else if(act==="settheme"){state.theme=el.dataset.t;persist();render();}
      else if(act==="clear"){if(confirm("Delete all expenses? This can't be undone.")){state.expenses=[];persist();render();toast("All expenses cleared");}}
    });
  });
  const searchEl=app.querySelector('[data-act="search"]');
  if(searchEl)searchEl.addEventListener("input",e=>{
    const pos=e.target.selectionStart;
    state.search=e.target.value;
    render();
    const fresh=app.querySelector('[data-act="search"]');
    if(fresh){fresh.focus();fresh.setSelectionRange(pos,pos);}
  });
  const sortEl=app.querySelector('[data-act="sort"]');
  if(sortEl)sortEl.addEventListener("change",e=>{state.sortBy=e.target.value;render();});
  const jumpEl=app.querySelector('[data-act="jump"]');
  if(jumpEl)jumpEl.addEventListener("change",e=>{const v=e.target.value;if(!v)return;if(state.period==="day")state.refDate=new Date(v+"T00:00:00");else if(state.period==="month"){const[y,m]=v.split("-");state.refDate=new Date(+y,+m-1,1);}else state.refDate=new Date(+v,state.refDate.getMonth(),1);render();});
  app.querySelectorAll('[data-act="budget"]').forEach(inp=>inp.addEventListener("change",e=>{state.budgets[inp.dataset.k]=+e.target.value;persist();render();}));
}

/* ---------- calculator ---------- */
const Calc=(()=>{
  let root=null,tab="calc",expr="",done=false,lastVal=null,people=2,lastFocus=null;
  const r2=x=>{const v=Math.round((x+Number.EPSILON)*100)/100;return Object.is(v,-0)?0:v;};
  const numOf=v=>{const n=parseFloat(v);return isFinite(n)?n:NaN;};
  const OPS="+-×÷";

  // tiny expression evaluator (no eval): + − × ÷, unary minus, precedence
  function evaluate(str){
    const s=str.replace(/[+\-×÷]+$/,"");
    if(!s)return{ok:false,error:""};
    const t=s.match(/\d*\.?\d+|\d+\.|[+\-×÷]/g)||[];
    let i=0;
    const factor=()=>{if(t[i]==="-"){i++;return -factor();}const n=parseFloat(t[i++]);if(isNaN(n))throw new Error("bad");return n;};
    const term=()=>{let v=factor();while(t[i]==="×"||t[i]==="÷"){const o=t[i++],b=factor();if(o==="÷"){if(b===0)throw new Error("div0");v/=b;}else v*=b;}return v;};
    const sum=()=>{let v=term();while(t[i]==="+"||t[i]==="-"){const o=t[i++],b=term();v=o==="+"?v+b:v-b;}return v;};
    try{const v=sum();if(i<t.length||!isFinite(v))throw new Error("bad");return{ok:true,value:r2(v)};}
    catch(e){return{ok:false,error:e.message==="div0"?"Can't divide by zero":"Check the expression"};}
  }

  // figures from the app
  function figures(){
    const now=new Date(),y=now.getFullYear(),m=now.getMonth(),n=new Date(y,m+1,0).getDate();
    const key=y+"-"+pad(m+1),today=iso(now);
    const sum=f=>r2(state.expenses.filter(f).reduce((t,e)=>t+e.amount,0));
    return{label:MN[m]+" "+y,monthly:+state.budgets.monthly||0,daily:+state.budgets.daily||0,
      spent:sum(e=>e.date.startsWith(key)),todaySpent:sum(e=>e.date===today),daysLeft:n-now.getDate()};
  }

  const TABS=[["calc","Calc"],["left","Left today"],["what","If I spend"],["split","Split"]];
  const fld=(id,label,val,step)=>`<label class="field"><span>${label}</span><input id="${id}" type="number" inputmode="decimal" step="${step||"0.01"}" min="0" value="${val}"></label>`;
  const use=()=>`<button class="btn-primary calc-use" id="c-use" disabled>Use as amount</button>`;

  function body(){
    if(tab==="calc")return`
      <div class="calc-screen"><div class="calc-expr" id="c-expr"></div><div class="calc-res" id="c-res">${money(0)}</div></div>
      <div class="calc-pad">
        <button data-k="C" class="op">C</button><button data-k="B" class="op" aria-label="Backspace">⌫</button><button data-k="÷" class="op">÷</button><button data-k="×" class="op">×</button>
        <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button data-k="-" class="op">−</button>
        <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button data-k="+" class="op">+</button>
        <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button data-k="=" class="eq">=</button>
        <button data-k="0" class="wide">0</button><button data-k=".">.</button>
      </div>${use()}`;
    const f=figures();
    if(tab==="left")return`
      <div class="calc-fields">${fld("c-monthly","Monthly budget ($)",f.monthly.toFixed(2))}${fld("c-spent","Spent so far this month ($)",f.spent.toFixed(2))}${fld("c-days","Days left (after today)",f.daysLeft,"1")}</div>
      <div class="calc-out" id="c-out"></div>`;
    if(tab==="what")return`
      <div class="calc-fields">${fld("c-amt","If I spend ($)","")}</div>
      <div class="calc-out" id="c-out"></div>${use()}`;
    return`
      <div class="calc-fields">${fld("c-total","Total ($)","")}
        <div class="field"><span>People</span><div class="calc-stepper"><button data-p="-1" aria-label="Fewer people">−</button><output id="c-people">${people}</output><button data-p="1" aria-label="More people">+</button></div></div></div>
      <div class="calc-out" id="c-out"></div>${use()}`;
  }

  let useValue=null;
  const setUse=v=>{useValue=(v>0&&isFinite(v))?r2(v):null;const b=document.getElementById("c-use");if(b)b.disabled=useValue===null;};
  const out=h=>{const o=document.getElementById("c-out");if(o)o.innerHTML=h;};
  const row=(l,v,cls)=>`<div class="calc-row"><span>${l}</span><b class="${cls||""}">${v}</b></div>`;

  function updateCalc(){
    const ex=document.getElementById("c-expr"),rs=document.getElementById("c-res");if(!ex||!rs)return;
    ex.textContent=expr.replace(/-/g,"−").replace(/([×÷+−])/g," $1 ").replace(/^ − /,"−").replace(/ {2,}/g," ").trim();
    const ev=evaluate(expr);
    rs.classList.remove("bad");
    if(ev.ok){rs.textContent=money(ev.value);setUse(ev.value);}
    else if(expr===""){rs.textContent=money(0);setUse(null);}
    else if(ev.error){rs.textContent=ev.error;rs.classList.add("bad");setUse(null);}
    else{rs.textContent="—";setUse(null);}
  }
  function key(k){
    if(k==="C"){expr="";done=false;}
    else if(k==="B"){if(done){expr="";done=false;}else expr=expr.slice(0,-1);}
    else if(k==="="){const ev=evaluate(expr);if(ev.ok){lastVal=ev.value;expr=String(ev.value);done=true;}}
    else if(OPS.includes(k)){
      if(expr===""){if(k==="-")expr="-";else if(lastVal!==null)expr=String(lastVal)+k;}
      else{done=false;if(OPS.includes(expr.slice(-1))){if(expr.length>1)expr=expr.slice(0,-1)+k;}else expr+=k;}
    }else{ // digit or dot
      if(done){expr="";done=false;}
      const seg=expr.split(/[+\-×÷]/).pop();
      if(k==="."){if(seg.includes("."))return;expr+=seg===""?"0.":".";}
      else{if(seg.replace(".","").length>=12||expr.length>=60)return;expr=(seg==="0")?expr.slice(0,-1)+k:expr+k;}
    }
    updateCalc();
  }

  function updateLeft(){
    const m=numOf(v("c-monthly")),sp=numOf(v("c-spent")),d=Math.floor(numOf(v("c-days")));
    if(isNaN(m)||isNaN(sp)){out(`<div class="calc-sub">Enter your budget and what you've spent.</div>`);return;}
    const rem=r2(m-sp),f=figures();
    if(rem<=0){out(`<div class="calc-big calc-badc">—</div><div class="calc-sub">You're ${rem===0?"exactly at":"over"} your monthly budget${rem<0?" by "+money(-rem):""}. Nothing left to spend this month.</div>`);return;}
    if(isNaN(d)||d<0){out(`<div class="calc-big">—</div><div class="calc-sub">Enter days left as 0 or more.</div>${row("Remaining",money(rem))}`);return;}
    const cmp=amt=>f.daily>0?row("Your daily limit",money(f.daily))+row("Compared with limit",amt>f.daily?"Above limit":"Within limit",amt>f.daily?"calc-badc":"calc-good"):"";
    if(d===0){
      out(`<div class="calc-sub">Left to spend today</div><div class="calc-big">${money(rem)}</div>
        <div class="calc-sub">Last day — this is what's left.</div>${cmp(rem)}`);return;
    }
    const per=r2(rem/d);
    out(`<div class="calc-sub">Left to spend per day</div><div class="calc-big">${money(per)}</div>
      <div class="calc-sub">Remaining ${money(rem)} ÷ ${d} ${d===1?"day":"days"} left</div>${cmp(per)}`);
  }
  function updateWhat(){
    const a=numOf(v("c-amt")),f=figures();
    setUse(a);
    if(isNaN(a)||a<=0){out(`<div class="calc-sub">Type an amount to see what it does to your ${f.label} budget.</div>`);return;}
    const tot=r2(f.spent+a),rem=r2(f.monthly-tot),td=r2(f.todaySpent+a);
    const mBad=f.monthly>0&&tot>f.monthly,dBad=f.daily>0&&td>f.daily;
    out(row("Spent so far",money(f.spent))+row("New month total",money(tot))+
      row(rem>=0?"New remaining":"Over budget by",money(Math.abs(rem)),rem<0?"calc-badc":"")+
      row("Monthly limit "+money(f.monthly),mBad?"Breaks it by "+money(tot-f.monthly):"Stays within",mBad?"calc-badc":"calc-good")+
      row("Today would be",money(td))+
      row("Daily limit "+money(f.daily),f.daily>0?(dBad?"Breaks it by "+money(td-f.daily):"Stays within"):"Not set",dBad?"calc-badc":"calc-good"));
  }
  function updateSplit(){
    const t=numOf(v("c-total")),n=people;
    document.getElementById("c-people").textContent=n;
    if(isNaN(t)||t<=0){out(`<div class="calc-sub">Enter a total to split between ${n} people.</div>`);setUse(null);return;}
    const cents=Math.round(t*100),base=Math.floor(cents/n),extra=cents-base*n;
    setUse(base/100);
    out(`<div class="calc-sub">Each person pays</div><div class="calc-big">${money(base/100)}</div>
      ${extra?`<div class="calc-sub">${extra} ${extra===1?"person pays":"people pay"} ${money((base+1)/100)} so the total adds up to ${money(cents/100)}.</div>`:`<div class="calc-sub">${money(cents/100)} ÷ ${n} people</div>`}`);
  }
  const v=id=>{const el=document.getElementById(id);return el?el.value:"";};
  function refresh(){if(tab==="calc")updateCalc();else if(tab==="left")updateLeft();else if(tab==="what")updateWhat();else updateSplit();}

  function draw(){
    root.innerHTML=`<div class="calc-overlay" data-close="1"><div class="calc-panel" role="dialog" aria-modal="true" aria-label="Calculator" tabindex="-1">
      <div class="calc-head"><h3>🧮 Calculator</h3><button class="calc-x" data-close="1" aria-label="Close">✕</button></div>
      <div class="calc-tabs" role="tablist">${TABS.map(([id,l])=>`<button role="tab" data-tab="${id}" class="${tab===id?"on":""}" aria-selected="${tab===id}">${l}</button>`).join("")}</div>
      ${body()}</div></div>`;
    useValue=null;refresh();
  }
  function onClick(e){
    const t=e.target;
    if(t.dataset.close&&(t.classList.contains("calc-overlay")||t.classList.contains("calc-x")))return close();
    if(t.dataset.tab){tab=t.dataset.tab;draw();return;}
    if(t.dataset.k!==undefined){key(t.dataset.k);return;}
    if(t.dataset.p){people=Math.min(20,Math.max(2,people+ +t.dataset.p));updateSplit();return;}
    if(t.id==="c-use"&&useValue!==null)useAmount(useValue);
  }
  function onKey(e){
    if(!root||!root.firstChild)return;
    if(e.key==="Escape"){e.preventDefault();e.stopPropagation();close();return;}
    if(tab!=="calc"||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;
    const k=e.key;
    if(/^[0-9.]$/.test(k))key(k);
    else if(k==="+")key("+");else if(k==="-")key("-");
    else if(k==="*"||k==="x"||k==="X")key("×");else if(k==="/"){e.preventDefault();key("÷");}
    else if(k==="Enter"||k==="="){if(k==="Enter"&&e.target.tagName==="BUTTON")return;e.preventDefault();key("=");}
    else if(k==="Backspace")key("B");else if(k==="c"||k==="C"||k==="Delete")key("C");
    else return;
    e.preventDefault();
  }
  function onInput(e){
    const id=e.target.id;
    if(id==="c-monthly"||id==="c-spent"||id==="c-days")updateLeft();
    else if(id==="c-amt")updateWhat();
    else if(id==="c-total")updateSplit();
  }
  function useAmount(val){
    const f=document.getElementById("f-amount");
    close(true);
    if(f){f.value=val.toFixed(2);f.dispatchEvent(new Event("input",{bubbles:true}));f.focus();}
    else{state.prefillAmount=val.toFixed(2);state.editTarget=null;pickedCat=null;state.showModal=true;render();state.prefillAmount=null;}
  }
  function open(){
    if(!root){root=document.createElement("div");root.id="calc-root";document.body.appendChild(root);
      root.addEventListener("click",onClick);root.addEventListener("input",onInput);document.addEventListener("keydown",onKey,true);}
    lastFocus=document.activeElement;tab="calc";expr="";done=false;
    draw();const p=root.querySelector(".calc-panel");if(p)p.focus();
  }
  function close(skipFocus){
    if(root)root.innerHTML="";
    if(!skipFocus&&lastFocus&&document.contains(lastFocus))lastFocus.focus();
  }
  return{open,close,evaluate};
})();

render();
</script>
</body>
</html>
